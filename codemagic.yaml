wworkflows:
  unity_ios_build:
    name: Unity iOS Build
    max_build_duration: 90
    instance_type: mac_mini_m1

    environment:
      vars:
        UNITY_VERSION: "6000.0.27f1"
        PROJECT_PATH: "."
        BUILD_METHOD: "BuildScript.BuildiOS"
        XCODE_VERSION: "16.0"
        UNITY_LICENSE: "personal"

    scripts:
      - name: Instalar Unity
        script: |
          echo "🔽 Verificando se Unity ${UNITY_VERSION} está instalado..."
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          if [ ! -f "$UNITY_PATH" ]; then
            echo "🚀 Instalando Unity ${UNITY_VERSION}..."
            unity-hub install --version ${UNITY_VERSION} --modules ios
          else
            echo "✅ Unity ${UNITY_VERSION} já está instalado."
          fi

      - name: Build iOS Project
        script: |
          echo "🔧 Iniciando build Unity iOS..."
          /Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity \
            -projectPath ${PROJECT_PATH} \
            -executeMethod ${BUILD_METHOD} \
            -buildTarget iOS \
            -quit -batchmode -nographics \
            -logFile build_log.txt

      - name: Verificar resultado
        script: |
          echo "🧩 Logs do build Unity:"
          cat build_log.txt | tail -n 50
          if grep -q "Build completed with a result of 'Succeeded'" build_log.txt; then
            echo "✅ Build Unity iOS concluído com sucesso."
          else
            echo "❌ Build Unity iOS falhou."
            exit 1
          fi

    artifacts:
      - build/ios