workflows:
  unity_ios_build:
    name: Unity iOS Build
    max_build_duration: 90
    instance_type: mac_mini_m1
    environment:
      vars:
        UNITY_VERSION: "6000.0.27f1"      # versão do Unity 6
        PROJECT_PATH: "."                 # caminho raiz do projeto
        BUILD_METHOD: "BuildScript.BuildiOS"
        XCODE_VERSION: "16.0"
        UNITY_LICENSE: "personal"         # usa licença gratuita
    scripts:
      - name: Build iOS Project
        script: |
          echo "🔧 Iniciando build Unity iOS..."
          /Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity \
            -projectPath ${PROJECT_PATH} \
            -executeMethod ${BUILD_METHOD} \
            -buildTarget iOS \
            -quit -batchmode -nographics
    artifacts:
      - build/ios
