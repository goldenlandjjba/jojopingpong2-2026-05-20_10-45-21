workflows:
  unity_ios_build:
    name: Unity iOS Build (Unsigned)
    max_build_duration: 120
    instance_type: mac_mini_m1

    environment:
      unity: "2023.1.10f1"  # Ou use o script de install se precisar
      groups:
        - unity_credentials
      vars:
        PROJECT_PATH: "."
        BUILD_METHOD: "BuildScript.BuildiOS"
        UNITY_IOS_DIR: "build/ios"
        XCODE_PROJECT: "Unity-iPhone.xcodeproj"
        XCODE_SCHEME: "Unity-iPhone"

    scripts:
      # Seus scripts de licença e install Unity (mantenha se usando custom version)
      - name: Activate Unity License
        script: |
          # ... (como antes)

      - name: Build iOS Project
        script: |
          # ... (como antes)

      - name: Build IPA Unsigned
        script: |
          echo "🏗️ Construindo IPA sem assinatura..."
          xcode-project build-ipa \
            --project "${UNITY_IOS_DIR}/${XCODE_PROJECT}" \
            --scheme "${XCODE_SCHEME}" \
            --no-codesign  # <-- Isso pula o signing!

      - name: Verificar resultado
        script: |
          # ... (como antes, mas sem checar signing)

    artifacts:
      - build/ios/*.ipa  # O IPA unsigned sai aqui

    # Sem publishing ou ios_signing!