workflows:
  unity_ios_build_signed:
    name: Unity iOS Build (Signed & App Store Connect)
    max_build_duration: 120
    instance_type: mac_mini_m1

    integrations:
      app_store_connect: "chave da apple" # <-- Substitua pelo nome EXATO da chave que está no painel do Codemagic

    environment:
      unity: "6000.3.16f1"
      groups:
        - unity_credentials
        - app_store_credentials # IMPORTANTE: Crie esse grupo no Codemagic com as chaves da Apple
      vars:
        PROJECT_PATH: "."
        BUILD_METHOD: "BuildScript.BuildiOS"
        UNITY_IOS_DIR: "build/ios"
        XCODE_PROJECT: "Unity-iPhone.xcodeproj"
        XCODE_SCHEME: "Unity-iPhone"
        BUNDLE_ID: "com.RafaelOlv.SustainedPong" # <-- Troque pelo seu Bundle ID real

      # Configuração automática de assinatura para App Store
      ios_signing:
        distribution_type: app_store
        bundle_identifier: $BUNDLE_ID

    scripts:
      - name: Activate Unity License
        script: |
          # ... (Seu script de licença como antes)

     - name: Build iOS Project (Exportando do Unity)
        script: |
          echo "⚙️ Exportando projeto Xcode através do Unity 6..."
          
          # Usando a variável nativa do Codemagic ($UNITY_EXECUTABLE)
          $UNITY_EXECUTABLE \
            -batchmode \
            -quit \
            -projectPath "${PROJECT_PATH}" \
            -executeMethod "${BUILD_METHOD}" \
            -logFile unity_build_log.txt
          
          # Guarda o status de saída do Unity
          UNITY_EXIT_CODE=$?
          
          # Se o arquivo de log existir, mostra ele no terminal (ajuda muito no debug)
          if [ -f unity_build_log.txt ]; then
            echo "📋 Mostrando final do log do Unity:"
            tail -n 100 unity_build_log.txt
          fi
          
          # Se o Unity falhou, encerra o build aqui
          if [ $UNITY_EXIT_CODE -ne 0 ]; then
            echo "❌ O Unity falhou com o status code $UNITY_EXIT_CODE"
            exit $UNITY_EXIT_CODE
          fi

      - name: Verificar se a pasta do Xcode foi criada
        script: |
          if [ ! -d "${UNITY_IOS_DIR}/${XCODE_PROJECT}" ]; then
            echo "❌ ERRO: O projeto Xcode não foi encontrado em ${UNITY_IOS_DIR}/${XCODE_PROJECT}."
            echo "Isso significa que o script BuildScript.BuildiOS falhou ou salvou na pasta errada."
            exit 1
          fi
          echo "✅ Projeto Xcode encontrado com sucesso!"

      - name: Build IPA (Assinado)
        script: |
          echo "🏗️ Construindo e assinando o IPA..."
          # Aqui removemos o --no-codesign. O Codemagic usará os perfis do ios_signing.
          xcode-project build-ipa \
            --project "${UNITY_IOS_DIR}/${XCODE_PROJECT}" \
            --scheme "${XCODE_SCHEME}"

    artifacts:
      - build/ios/build/ipa/*.ipa # O caminho padrão onde o xcode-project salva o IPA
      - unity_build_log.txt       # Salva o log do Unity para você inspecionar depois

    publishing:
      app_store_connect:
        # Requer que você conecte sua conta Apple no Codemagic (Teams > Integrations)
        auth: integration 
        submit_to_testflight: true # Mude para false se quiser apenas subir, sem mandar pro TestFlight
