workflows:
  unity_ios_build_signed:
    name: "Unity iOS Build (Signed & App Store Connect)"
    max_build_duration: 120
    instance_type: mac_mini_m1

    integrations:
      app_store_connect: "chave da apple"

    environment:
      unity: "6000.3.16f1"
      groups:
        - unity_credentials
        - app_store_credentials
      vars:
        PROJECT_PATH: "."
        BUILD_METHOD: "BuildScript.BuildiOS"
        UNITY_IOS_DIR: "build/ios"
        XCODE_PROJECT: "Unity-iPhone.xcodeproj"
        XCODE_SCHEME: "Unity-iPhone"
        BUNDLE_ID: "com.RafaelOlv.SustainedPong"

      ios_signing:
        distribution_type: app_store
        bundle_identifier: "com.RafaelOlv.SustainedPong"

    scripts:
      - name: Activate Unity License
        script: |
          # ... (Seu script de licença como antes)

      - name: Build iOS Project (Exportando do Unity)
        script: |
          echo "⚙️ Exportando projeto Xcode através do Unity 6..."
          
          # Definição manual e segura do caminho do Unity 6 no Mac do Codemagic
          UNITY_PATH="/Applications/Unity/Hub/Editor/6000.3.16f1/Unity.app/Contents/MacOS/Unity"
          
          # Se o caminho acima não existir, tenta o caminho alternativo padrão
          if [ ! -f "$UNITY_PATH" ]; then
            UNITY_PATH="/Applications/Unity/Unity.app/Contents/MacOS/Unity"
          fi
          
          echo "🚀 Executando Unity a partir de: $UNITY_PATH"
          
          # Execução usando o caminho direto resolvido
          "$UNITY_PATH" -batchmode -quit -projectPath "${PROJECT_PATH}" -executeMethod "${BUILD_METHOD}" -logFile unity_build_log.txt
          
          UNITY_EXIT_CODE=$?
          
          if [ -f unity_build_log.txt ]; then
            echo "📋 Mostrando final do log do Unity:"
            tail -n 100 unity_build_log.txt
          fi
          
          if [ $UNITY_EXIT_CODE -ne 0 ]; then
            echo "❌ O Unity falhou com o status code $UNITY_EXIT_CODE"
            exit $UNITY_EXIT_CODE
          fi

      - name: Verificar se a pasta do Xcode foi criada
        script: |
          if [ ! -d "${UNITY_IOS_DIR}/${XCODE_PROJECT}" ]; then
            echo "❌ ERRO: O projeto Xcode não foi encontrado em ${UNITY_IOS_DIR}/${XCODE_PROJECT}."
            exit 1
          fi
          echo "✅ Projeto Xcode encontrado com sucesso!"

      - name: Build IPA (Assinado)
        script: |
          echo "🏗️ Construindo e assinando o IPA..."
          xcode-project build-ipa \
            --project "${UNITY_IOS_DIR}/${XCODE_PROJECT}" \
            --scheme "${XCODE_SCHEME}"

    artifacts:
      - build/ios/build/ipa/*.ipa
      - unity_build_log.txt

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
